name: journal
description: "Journal — МГТЭК · Дневник: расписание, оценки и пропуски."
publish_to: none
version: 1.0.2-beta.2+20

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # Официальная библиотека Material от команды Flutter (с Flutter 3.47 живёт отдельным пакетом).
  # Локализации Material/Widgets/Cupertino теперь тоже внутри неё.
  material_ui: ^1.5.0
  dynamic_color: ^2.1.0
  http: ^1.2.2
  pub_semver: ^2.2.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.2
  # Резервная копия в файл: отправка через системное меню и выбор файла для восстановления.
  share_plus: ^11.0.0
  file_picker: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/preview/
    - assets/icons/bell.png
    - assets/icons/clapper.png
