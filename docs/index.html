<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#121218;color:#e6e1e9;font:500 17px/1.5 'Onest',system-ui,sans-serif;text-align:center}
html[data-theme="light"] body{background:#fbf8ff;color:#1b1b21}
.b{display:grid;gap:18px;justify-items:center;padding:24px}
.b img{width:96px;height:96px;border-radius:28px}
.b a{display:inline-block;padding:14px 26px;border-radius:99px;background:#b8c0ff;color:#1f2a5e;font-weight:600;text-decoration:none;margin:4px}
.b a.t{background:#373f7a;color:#dfe0ff}
</style>
</head>
<body>
<div class="b"><img src="assets/icon-192.png" alt="Journal" width="96" height="96">
<noscript><p>Выберите версию сайта:</p></noscript>
<p><a href="mobile/">Для телефона</a><a class="t" href="desktop/">Для компьютера</a></p></div>
<script>
(function(){
  var q=location.search.match(/[?&]view=(mobile|desktop)/),v=q&&q[1];
  try{ if(v) localStorage.setItem('journal-view',v); else v=localStorage.getItem('journal-view'); }catch(e){}
  if(v!=='mobile'&&v!=='desktop'){
    var ua=navigator.userAgent||'';
    var phone=/Android.+Mobile|iPhone|iPod|Windows Phone/i.test(ua)||(window.innerWidth<800);
    v=phone?'mobile':'desktop';
  }
  var hash=location.hash||'';
  location.replace(v+'/'+hash);
})();
</script>
</body>
