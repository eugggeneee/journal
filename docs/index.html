<style>
html{background:#121218;color:#e6e1e9;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
img{width:96px;height:96px;border-radius:28px;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(.92)}}
a{display:inline-block;margin:6px;padding:12px 22px;border-radius:999px;background:#373f7a;color:#dfe0ff;text-decoration:none;font-weight:600}
p{opacity:.8}
</style>

<body>
<div>
  <img src="assets/icon-512.png" alt="Journal">
  <h1>Journal</h1>
  <p>Открываем подходящую версию страницы…</p>
  <noscript><a href="desktop/">Версия для компьютера</a><a href="mobile/">Версия для телефона</a></noscript>
</div>
<script>
(function(){
  var view=null,q=null;
  try{q=new URLSearchParams(location.search).get('view')}catch(e){}
  if(q==='mobile'||q==='desktop'){view=q;try{localStorage.setItem('journal-view',q)}catch(e){}}
  if(!view){try{view=localStorage.getItem('journal-view')}catch(e){}}
  if(view!=='mobile'&&view!=='desktop'){
    var ua=navigator.userAgent||'';
    view=(innerWidth<800||/iPhone|iPod|Android.*Mobile|Windows Phone/i.test(ua))?'mobile':'desktop';
  }
  location.replace(view+'/'+location.hash);
})();
</script>
