name: Каталог Journal для iOS
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/logo.png'
      - 'scripts/release/altstore_source.py'
      - 'scripts/release/build_catalog.py'
      - '.github/workflows/site.yml'
  workflow_run:
    workflows: [Release, 'Пак скриншотов Journal']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/journal-ipa-metadata
          key: catalog-metadata-${{ github.run_id }}
          restore-keys: catalog-metadata-
      - name: Собрать стабильный и тестовый каталоги
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_CACHE: ${{ runner.temp }}/journal-ipa-metadata
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/release/build_catalog.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}ios/
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
