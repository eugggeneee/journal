name: Site

# Сайт приложения (папка site/) публикуется на GitHub Pages: https://eugggeneee.github.io/journal/
# Один раз включить: Settings, Pages, Source: GitHub Actions.
# Блок «Что нового» сайт берёт из GitHub Releases при открытии страницы, поэтому пересборка после релиза не нужна.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'lib/core/palette.dart'
      - 'docs/logo.png'
      - 'assets/icons/preview/**'
      - 'scripts/site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/project/check.py
      - run: python3 scripts/site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
