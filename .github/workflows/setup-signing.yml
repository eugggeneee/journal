name: Создать ключ подписи Android

# Запускается вручную ОДИН раз: Actions → «Создать ключ подписи Android» → Run workflow.
# Создаёт ключ и сам записывает четыре секрета ANDROID_KEYSTORE_* в репозиторий.
# Нужен секрет SETUP_PAT (временный токен) — см. docs/RELEASING.md. После запуска токен можно удалить.
on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Перезаписать существующий ключ (обновления поверх старых версий перестанут работать!)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  keystore:
    name: Ключ подписи
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SETUP_PAT }}
      GH_REPO: ${{ github.repository }}
      OVERWRITE: ${{ inputs.overwrite }}
    steps:
      - name: Проверка токена
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Не задан секрет SETUP_PAT. Создайте токен и добавьте его секретом (инструкция в docs/RELEASING.md)."
            exit 1
          fi
          gh secret list >/dev/null

      - name: Ключ уже есть?
        run: |
          if gh secret list | grep -q '^ANDROID_KEYSTORE_BASE64' && [ "$OVERWRITE" != "true" ]; then
            echo "::error::Ключ уже создан. Повторный запуск сломает обновления. Если это действительно нужно — запустите с галочкой «Перезаписать»."
            exit 1
          fi

      - name: Создать ключ и записать секреты
        run: |
          set -euo pipefail
          PASS="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | cut -c1-24)"
          echo "::add-mask::$PASS"
          KS="$RUNNER_TEMP/journal-release.jks"
          keytool -genkeypair \
            -keystore "$KS" -storetype PKCS12 \
            -alias journal -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Journal, OU=Journal, O=Journal, C=BY"
          base64 -w0 "$KS" | gh secret set ANDROID_KEYSTORE_BASE64
          gh secret set ANDROID_KEYSTORE_PASSWORD --body "$PASS"
          gh secret set ANDROID_KEY_PASSWORD --body "$PASS"
          gh secret set ANDROID_KEY_ALIAS --body "journal"
          rm -f "$KS"
          echo "Готово: секреты ANDROID_KEYSTORE_* записаны. Токен SETUP_PAT теперь можно удалить."
