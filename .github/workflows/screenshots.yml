name: Пак скриншотов Journal
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      channel:
        description: Канал опубликованной версии
        type: choice
        options: [stable, beta]
        default: stable
      force_rebuild:
        description: Переснять готовый комплект
        type: boolean
        default: false

env:
  CHANNEL: ${{ inputs.channel || 'stable' }}

permissions:
  contents: read
concurrency:
  group: screenshot-pack-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ready: ${{ steps.release.outputs.ready }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 scripts/screenshots/latest.py "$CHANNEL")
          git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_OUTPUT"
          ready=false
          if [[ "${{ inputs.force_rebuild }}" != true ]] && git ls-remote --exit-code origin refs/heads/screenshots >/dev/null; then
            git clone --quiet --depth 1 --branch screenshots "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/previous"
            python3 -m pip install --quiet Pillow
            git show "$tag:assets/icons/icons.json" > "$RUNNER_TEMP/palette.json"
            ready=$(python3 scripts/screenshots/pack.py check "$RUNNER_TEMP/previous/pack/$CHANNEL" "$tag" "$RUNNER_TEMP/palette.json" "$(git rev-parse "$tag^{commit}")")
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == true ]]; then
            echo "Для $tag всё готово. Галерея канала $CHANNEL уже проверена." >> "$GITHUB_STEP_SUMMARY"
          fi
  capture:
    needs: plan
    if: needs.plan.outputs.ready == 'false'
    runs-on: macos-15
    timeout-minutes: 55
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: capture-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Подготовить исходники выбранного выпуска
        run: |
          set -euo pipefail
          cd capture-app
          flutter create --platforms=ios --org eugggeneee --project-name journal .
          python3 scripts/icons/setup_ios.py
          cd ..
          python3 scripts/screenshots/prepare.py capture-app
          cd capture-app
          flutter pub get
      - name: Снять экраны iPhone
        run: |
          bash scripts/icons/select_xcode.sh
          python3 scripts/screenshots/record.py capture-app "$RUNNER_TEMP/frames"
          mkdir -p "$RUNNER_TEMP/frames/fonts"
          cp "$FLUTTER_ROOT"/bin/cache/artifacts/material_fonts/roboto-{black,bold,medium}.ttf "$RUNNER_TEMP/frames/fonts/"
      - uses: actions/upload-artifact@v7
        with:
          name: capture-ios
          path: ${{ runner.temp }}/frames
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: [plan, capture]
    concurrency:
      group: publish-screenshot-pack
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: capture-app
      - uses: actions/download-artifact@v5
        with:
          name: capture-ios
          path: frames
      - name: Собрать и проверить кадры iPhone, рамки и макеты
        run: |
          python3 -m pip install --quiet Pillow
          JOURNAL_FONT_DIR=frames/fonts python3 scripts/screenshots/pack.py build frames "$RUNNER_TEMP/new-pack" capture-app "$TAG" "$SOURCE_SHA"
      - name: Заменить предыдущий полный пак
        run: |
          set -euo pipefail
          [[ "$(python3 scripts/screenshots/latest.py "$CHANNEL")" == "$TAG" ]]
          repo="$RUNNER_TEMP/gallery"
          git init --quiet -b screenshots "$repo"
          cd "$repo"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          if git ls-remote --exit-code origin refs/heads/screenshots >/dev/null; then
            git fetch --depth=1 origin screenshots
            git reset --hard FETCH_HEAD
            if [[ -f pack/manifest.json ]]; then
              legacy=(pack/{ios,frames,mockups,README.md,manifest.json})
              if [[ "$CHANNEL" == stable ]]; then
                git rm -rq -- "${legacy[@]}"
              else
                mkdir -p pack/stable
                git mv "${legacy[@]}" pack/stable/
              fi
            fi
            git rm -rq --ignore-unmatch -- "pack/$CHANNEL"
          fi
          mkdir -p pack
          cp -R "$RUNNER_TEMP/new-pack" "pack/$CHANNEL"
          echo '# Галереи Journal для iPhone' > pack/README.md
          for channel in stable beta; do
            if [[ -f pack/$channel/manifest.json ]]; then
              echo >> pack/README.md
              echo "[$channel · $(jq -r .tag pack/$channel/manifest.json)]($channel/)" >> pack/README.md
            fi
          done
          git add pack
          if git diff --cached --quiet; then
            echo "Опубликованный комплект совпадает с переснятым." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "docs(screenshots): обновить галерею $TAG"
          [[ "$(python3 "$GITHUB_WORKSPACE/scripts/screenshots/latest.py" "$CHANNEL")" == "$TAG" ]]
          git push origin HEAD:refs/heads/screenshots
          echo "[Готовый пак $TAG](https://github.com/$GITHUB_REPOSITORY/tree/screenshots/pack)" >> "$GITHUB_STEP_SUMMARY"
