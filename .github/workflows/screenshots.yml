name: Пак скриншотов Journal
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: stable-screenshot-pack
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ready: ${{ steps.release.outputs.ready }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_OUTPUT"
          ready=false
          if git ls-remote --exit-code origin refs/heads/screenshots >/dev/null; then
            git clone --quiet --depth 1 --branch screenshots "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/previous"
            python3 -m pip install --quiet Pillow
            git show "$tag:assets/icons/icons.json" > "$RUNNER_TEMP/palette.json"
            ready=$(python3 scripts/screenshots/pack.py check "$RUNNER_TEMP/previous/pack" "$tag" "$RUNNER_TEMP/palette.json")
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == true ]]; then
            echo "Для $tag всё готово. Повторите после следующего стабильного релиза." >> "$GITHUB_STEP_SUMMARY"
          fi
  capture:
    needs: plan
    if: needs.plan.outputs.ready == 'false'
    runs-on: macos-15
    timeout-minutes: 55
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: stable-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Подготовить исходники стабильного релиза
        run: |
          set -euo pipefail
          cd stable-app
          flutter create --platforms=ios --org eugggeneee --project-name journal .
          python3 scripts/icons/setup_ios.py
          cd ..
          python3 scripts/screenshots/prepare.py stable-app
          cd stable-app
          flutter pub get
      - name: Снять экраны iPhone
        run: |
          bash scripts/icons/select_xcode.sh
          python3 scripts/screenshots/record.py stable-app "$RUNNER_TEMP/frames"
      - uses: actions/upload-artifact@v5
        with:
          name: capture-ios
          path: ${{ runner.temp }}/frames
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: [plan, capture]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: stable-app
      - uses: actions/download-artifact@v8
        with:
          name: capture-ios
          path: frames
      - name: Собрать и проверить кадры iPhone, рамки и макеты
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/screenshots/pack.py build frames "$RUNNER_TEMP/new-pack" stable-app "$TAG" "$SOURCE_SHA"
      - name: Заменить предыдущий полный пак
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$TAG" ]]
          repo="$RUNNER_TEMP/gallery"
          git init --quiet -b screenshots "$repo"
          cd "$repo"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          if git ls-remote --exit-code origin refs/heads/screenshots >/dev/null; then
            git fetch --depth=1 origin screenshots
            git reset --hard FETCH_HEAD
            git rm -rq --ignore-unmatch -- pack
          fi
          cp -R "$RUNNER_TEMP/new-pack" pack
          git add pack
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "docs(screenshots): обновить галерею $TAG"
          git push origin HEAD:refs/heads/screenshots
          echo "[Готовый пак $TAG](https://github.com/$GITHUB_REPOSITORY/tree/screenshots/pack)" >> "$GITHUB_STEP_SUMMARY"
